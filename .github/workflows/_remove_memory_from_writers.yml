name: Remove Memory From Chapter Writers

on:
  push:
    branches: [bugfixes]
    paths:
      - .github/workflows/_remove_memory_from_writers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0

      - name: Patch writer contexts
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          # Context builder: disable Story Memory only for WRITE_CHAPTER and CHANGE_CHAPTER.
          p = Path('engine/context.py')
          text = p.read_text(encoding='utf-8')
          old = '"Memory": max(100, min(450, max_context_tokens // 10)),'
          new = '"Memory": (0 if task in (TaskType.WRITE_CHAPTER, TaskType.CHANGE_CHAPTER) else max(100, min(450, max_context_tokens // 10))),'
          if text.count(old) != 1:
              raise SystemExit(f'context.py expected one writing Memory budget line, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Write Chapter continuation: remove Memory from its dedicated continuity anchors.
          p = Path('engine/workflow.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('    def _build_chapter_continuation_prompt(')
          end = text.index('\n    def _parse_completion_evaluation', start)
          fn = text[start:end]
          fn, n = re.subn(r'^\s*memory_raw\s*=.*\n', '', fn, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f'workflow.py expected one continuation memory_raw assignment, found {n}')
          fn, n = re.subn(r'^\s*\("memory".*\n', '', fn, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f'workflow.py expected one continuation memory slot, found {n}')
          fn, n = re.subn(r'^\s*f"Story memory:.*\n', '', fn, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f'workflow.py expected one continuation Story memory line, found {n}')
          fn = fn.replace(' memory=%d', '', 1)
          fn = fn.replace('len(allocated["world"]), len(allocated["memory"]), len(allocated["prose_tail"])',
                          'len(allocated["world"]), len(allocated["prose_tail"])', 1)
          text = text[:start] + fn + text[end:]
          p.write_text(text, encoding='utf-8')

          # Change Chapter: remove Memory from the target-chapter context and continuation anchors.
          p = Path('engine/change_chapter.py')
          text = p.read_text(encoding='utf-8')

          start = text.index('def build_clean_context_sections(')
          end = text.index('\ndef build_full_rewrite_prompt', start)
          fn = text[start:end]
          fn, n = re.subn(r'^\s*memory\s*=.*\n', '', fn, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f'change_chapter.py expected one main memory assignment, found {n}')
          fn, n = re.subn(r'^\s*if memory != "\(none\)":\n\s+sections\.append\(.*STORY MEMORY.*\n', '', fn, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f'change_chapter.py expected one main memory section, found {n}')
          text = text[:start] + fn + text[end:]

          start = text.index('def _build_continuation_prompt(')
          end = text.index('\ndef trim_leading_overlap', start)
          fn = text[start:end]
          fn, n = re.subn(r'^\s*memory_raw\s*=.*\n', '', fn, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f'change_chapter.py expected one continuation memory_raw assignment, found {n}')
          fn, n = re.subn(r'^\s*\("memory".*\n', '', fn, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f'change_chapter.py expected one continuation memory slot, found {n}')
          fn, n = re.subn(r'^\s*f"Story memory:.*\n', '', fn, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f'change_chapter.py expected one continuation Story memory line, found {n}')
          fn = fn.replace(' memory=%d', '', 1)
          fn = fn.replace('len(allocated["world"]), len(allocated["memory"]),\n        len(allocated["prose_tail"])',
                          'len(allocated["world"]), len(allocated["prose_tail"])', 1)
          text = text[:start] + fn + text[end:]
          p.write_text(text, encoding='utf-8')

          # Validate the exact scopes we changed and keep other workflows untouched.
          for path in ('engine/context.py', 'engine/workflow.py', 'engine/change_chapter.py'):
              compile(Path(path).read_text(encoding='utf-8'), path, 'exec')

          context_text = Path('engine/context.py').read_text(encoding='utf-8')
          workflow_text = Path('engine/workflow.py').read_text(encoding='utf-8')
          change_text = Path('engine/change_chapter.py').read_text(encoding='utf-8')

          assert '"Memory": (0 if task in (TaskType.WRITE_CHAPTER, TaskType.CHANGE_CHAPTER)' in context_text

          ws = workflow_text[workflow_text.index('    def _build_chapter_continuation_prompt('):]
          ws = ws[:ws.index('\n    def _parse_completion_evaluation')]
          assert 'memory_raw' not in ws and 'allocated["memory"]' not in ws and 'Story memory:' not in ws

          cs = change_text[change_text.index('def build_clean_context_sections('):]
          cs = cs[:cs.index('\ndef build_full_rewrite_prompt')]
          assert 'STORY MEMORY' not in cs and 'project.memory' not in cs
          cc = change_text[change_text.index('def _build_continuation_prompt('):]
          cc = cc[:cc.index('\ndef trim_leading_overlap')]
          assert 'memory_raw' not in cc and 'allocated["memory"]' not in cc and 'Story memory:' not in cc

          helper = Path('.github/workflows/_remove_memory_from_writers.yml')
          helper.unlink()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'engine/context.py', 'engine/workflow.py', 'engine/change_chapter.py', str(helper)], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: exclude story memory from chapter writing'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:bugfixes'], check=True)
