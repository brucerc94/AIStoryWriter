name: Scope Chapter Context

on:
  push:
    branches: [bugfixes]
    paths:
      - .github/workflows/_scope_chapter_context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0

      - name: Apply scoped chapter context
        shell: python
