name: Scope Chapter Context

on:
  push:
    branches: [bugfixes]
    paths:
      - .github/workflows/_scope_chapter_context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0

      - name: Apply scoped chapter context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def replace_function(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          # context.py: add deterministic relevance helpers.
          p = Path("engine/context.py")
          text = p.read_text(encoding="utf-8")
          if "def build_relevant_chapter_context(" not in text:
              text = text.replace("import logging\n", "import logging\nimport re\nimport unicodedata\n", 1)
              helper = '''

_CHAPTER_MATCH_STOPWORDS = {
    "about", "after", "again", "also", "before", "being", "between", "could", "from", "have",
    "into", "just", "more", "other", "over", "same", "some", "than", "that", "their", "there",
    "these", "they", "this", "those", "through", "under", "very", "what", "when", "where", "which",
    "while", "with", "would", "chapter", "scene", "story", "plan", "must", "should", "then", "only",
    "para", "como", "desde", "esta", "este", "estas", "estos", "entre", "sobre", "hacia", "donde",
    "cuando", "quien", "quienes", "tambien", "todo", "todos", "toda", "todas", "debe", "deben", "con",
    "por", "del", "las", "los", "una", "uno", "unas", "unos", "que", "sus", "ser", "sea", "son",
}


def _normalize_match_text(text: str) -> str:
    normalized = unicodedata.normalize("NFKD", text or "")
    normalized = "".join(ch for ch in normalized if not unicodedata.combining(ch))
    return re.sub(r"[^a-z0-9]+", " ", normalized.casefold()).strip()


def _meaningful_words(text: str) -> set[str]:
    return {
        word for word in re.findall(r"[a-z0-9]{4,}", _normalize_match_text(text))
        if word not in _CHAPTER_MATCH_STOPWORDS
    }


def select_relevant_characters(characters: list, source_text: str, max_characters: int = 12, max_chars: int = 5000) -> str:
    """Return only canon character records explicitly referenced by chapter planning/context."""
    source_norm = " " + _normalize_match_text(source_text) + " "
    selected = []
    for character in characters:
        name = (getattr(character, "name", "") or "").strip()
        if not name:
            continue
        name_norm = _normalize_match_text(name)
        if not name_norm:
            continue
        tokens = name_norm.split()
        matched = f" {name_norm} " in source_norm
        if not matched and len(tokens) == 1:
            matched = f" {tokens[0]} " in source_norm
        if not matched and len(tokens) > 1:
            matched = all(f" {token} " in source_norm for token in tokens)
        if matched:
            selected.append(character)
        if len(selected) >= max_characters:
            break
    return _truncate_to_budget(format_characters_block(selected), max(1, max_chars // 4))


def _markdown_world_sections(world: str) -> list[tuple[int, str, str]]:
    matches = list(re.finditer(r"(?m)^##\s+(.+?)\s*$", world or ""))
    sections = []
    for index, match in enumerate(matches):
        start = match.start()
        end = matches[index + 1].start() if index + 1 < len(matches) else len(world)
        sections.append((index, match.group(1).strip(), world[start:end].strip()))
    return sections


def select_relevant_world(world: str, source_text: str, max_sections: int = 4, max_chars: int = 6000) -> str:
    """Return the highest-scoring world sections referenced by this chapter context."""
    sections = _markdown_world_sections(world)
    if not sections:
        return ""
    source_words = _meaningful_words(source_text)
    scored = []
    for index, title, body in sections:
        title_words = _meaningful_words(title)
        body_words = _meaningful_words(body)
        score = len(source_words & title_words) * 5 + len(source_words & body_words)
        if score > 0:
            scored.append((score, index, body))
    scored.sort(key=lambda item: (-item[0], item[1]))
    chosen = sorted(scored[:max_sections], key=lambda item: item[1])
    blocks = []
    remaining = max_chars
    for _score, _index, body in chosen:
        if remaining <= 0:
            break
        block = body if len(body) <= remaining else body[:remaining].rstrip() + "\n\n[... world section truncated ...]"
        blocks.append(block)
        remaining -= len(block) + 2
    return "\n\n".join(blocks).strip()


def build_relevant_chapter_context(project: Project, source_text: str, max_character_chars: int = 5000, max_world_chars: int = 6000) -> tuple[str, str]:
    """Resolve scoped Characters and World from project canon without an LLM call."""
    return (
        select_relevant_characters(project.characters, source_text, max_chars=max_character_chars),
        select_relevant_world(project.world, source_text, max_chars=max_world_chars),
    )
'''
              text = text.replace('def _estimate_tokens(text: str) -> int:\n', helper + '\n\ndef _estimate_tokens(text: str) -> int:\n', 1)

          # Prevent generic project context (including chat summary) from reaching Write/Change Chapter.
          start = text.index('def _build_story_context_text(')
          end = text.index('\ndef _repair_alternation(', start)
          fn = text[start:end]
          old = '''        else:\n            if sections["Synopsis"]:\n                parts.append(f"\\n\\n{sections['Synopsis']}")\n            if sections["Characters"]:\n                parts.append(f"\\n\\n## Established Characters\\n{sections['Characters']}")\n            if sections["Outline"]:\n                parts.append(f"\\n\\n## Outline\\n{sections['Outline']}")\n            if sections["World"]:\n                parts.append(f"\\n\\n## World & Setting\\n{sections['World']}")\n            if sections["Memory"]:\n                parts.append(f"\\n\\n## Story Memory\\n{sections['Memory']}")\n            if sections["Chat Summary"]:\n                parts.append(f"\\n\\n## Conversation Summary (older messages)\\n{sections['Chat Summary']}")\n            if sections["Creative Direction"]:\n                parts.append(f"\\n\\n## Author's Creative Direction\\n{sections['Creative Direction']}")\n'''
          new = '''        elif task in (TaskType.WRITE_CHAPTER, TaskType.CHANGE_CHAPTER):\n            # Chapter workflows inject their own scoped canon; never add synopsis, full canon,\n            # story memory, chat summary, or other project-wide context here.\n            pass\n        else:\n            if sections["Synopsis"]:\n                parts.append(f"\\n\\n{sections['Synopsis']}")\n            if sections["Characters"]:\n                parts.append(f"\\n\\n## Established Characters\\n{sections['Characters']}")\n            if sections["Outline"]:\n                parts.append(f"\\n\\n## Outline\\n{sections['Outline']}")\n            if sections["World"]:\n                parts.append(f"\\n\\n## World & Setting\\n{sections['World']}")\n            if sections["Memory"]:\n                parts.append(f"\\n\\n## Story Memory\\n{sections['Memory']}")\n            if sections["Chat Summary"]:\n                parts.append(f"\\n\\n## Conversation Summary (older messages)\\n{sections['Chat Summary']}")\n            if sections["Creative Direction"]:\n                parts.append(f"\\n\\n## Author's Creative Direction\\n{sections['Creative Direction']}")\n'''
          if old not in fn:
              raise SystemExit('context.py story-context branch not found')
          fn = fn.replace(old, new, 1)
          text = text[:start] + fn + text[end:]
          p.write_text(text, encoding='utf-8')

          # workflow.py import and Write Chapter prompt/continuation scoping.
          p = Path('engine/workflow.py')
          text = p.read_text(encoding='utf-8')
          if '    build_relevant_chapter_context,\n' not in text:
              text = text.replace('    budget_allocate,\n    format_characters_block,\n', '    budget_allocate,\n    build_relevant_chapter_context,\n    format_characters_block,\n', 1)

          start = text.index('    def _build_chapter_generation_prompt(')
          end = text.index('\n    def _run_write_chapter', start)
          new_fn = '''    def _build_chapter_generation_prompt(self, chapter_num: int, outline_entry: str, checklist: str) -> str:\n        sections = []\n\n        prev_tail = ""\n        if chapter_num > 1:\n            prev = next((c for c in self.project.chapters if c.number == chapter_num - 1), None)\n            if prev and prev.content:\n                prev_tail = prev.content[-800:].strip()\n\n        selection_source = "\\n\\n".join(\n            part for part in (outline_entry, checklist, prev_tail, self.extra_input.strip()) if part\n        )\n        relevant_characters, relevant_world = build_relevant_chapter_context(\n            self.project, selection_source, max_character_chars=5000, max_world_chars=6000\n        )\n\n        if outline_entry:\n            sections.append(prompts.render(\n                "change_chapter/section", heading="CHAPTER OUTLINE (binding)", body=outline_entry,\n            ))\n        if checklist:\n            sections.append(prompts.render(\n                "change_chapter/section",\n                heading="INTERNAL REQUIREMENTS CHECKLIST (write ordinary prose — never expose this list to the reader)",\n                body=checklist,\n            ))\n        if relevant_characters:\n            sections.append(prompts.render(\n                "change_chapter/section",\n                heading="RELEVANT CHARACTERS (project canon — use only these established records)",\n                body=relevant_characters,\n            ))\n        if relevant_world:\n            sections.append(prompts.render(\n                "change_chapter/section",\n                heading="RELEVANT WORLD & SETTING (project canon — scoped to this chapter)",\n                body=relevant_world,\n            ))\n        if prev_tail:\n            sections.append(prompts.render(\n                "change_chapter/section", heading="END OF PREVIOUS CHAPTER (continuity only)", body=prev_tail,\n            ))\n\n        style_frag = self.project.writing_style.to_prompt_fragment()\n        if style_frag:\n            sections.append(prompts.render("change_chapter/section", heading="STYLE TO APPLY", body=style_frag))\n\n        intent = self.project.author_intent\n        intent_lines = []\n        if intent.emotional_journey:\n            intent_lines.append(f"Emotional tone to sustain in this chapter: {intent.emotional_journey}")\n        if intent.avoid:\n            intent_lines.append(f"Avoid entirely: {intent.avoid}")\n        if intent_lines:\n            sections.append(prompts.render("change_chapter/section", heading="AUTHOR INTENT", body="\\n".join(intent_lines)))\n\n        if self.extra_input and self.extra_input.strip():\n            sections.append(prompts.render("change_chapter/section", heading="AUTHOR'S REQUEST", body=self.extra_input.strip()))\n\n        return prompts.render(\n            "write_chapter/generation_user",\n            chapter_number=chapter_num,\n            title=self.project.title,\n            sections="\\n\\n".join(sections),\n        )\n'''
          text = text[:start] + new_fn.rstrip() + '\n\n' + text[end:]

          start = text.index('    def _build_chapter_continuation_prompt(')
          end = text.index('\n    def _parse_completion_evaluation', start)
          fn = text[start:end]
          old = '''        chars_raw     = (format_characters_block(self.project.characters[:12]) or "(none)").strip()\n        world_raw     = (self.project.world or "").strip() or "(none)"\n        prev_tail_raw = "(none)"\n'''
          new = '''        prev_tail_raw = "(none)"\n'''
          if old not in fn:
              raise SystemExit('Write continuation raw context block not found')
          fn = fn.replace(old, new, 1)
          old = '''        prose_tail_raw = chapter_text.strip()\n\n        # Build checklist block (fixed text – not dynamically budgeted).\n'''
          new = '''        prose_tail_raw = chapter_text.strip()\n        selection_source = "\\n\\n".join(\n            part for part in (outline_raw, chapter_goal, checklist, prev_tail_raw, prose_tail_raw) if part\n        )\n        chars_raw, world_raw = build_relevant_chapter_context(\n            self.project, selection_source, max_character_chars=5000, max_world_chars=6000\n        )\n\n        # Build checklist block (fixed text – not dynamically budgeted).\n'''
          if old not in fn:
              raise SystemExit('Write continuation insertion point not found')
          fn = fn.replace(old, new, 1)
          fn = fn.replace('outline > characters > world > memory > prev_tail > prose_tail', 'outline > characters > world > prev_tail > prose_tail', 1)
          text = text[:start] + fn + text[end:]
          p.write_text(text, encoding='utf-8')

          # change_chapter.py: use scoped canon in first rewrite and continuations.
          p = Path('engine/change_chapter.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from engine.context import budget_allocate, extract_outline_section, format_characters_block\n', 'from engine.context import budget_allocate, build_relevant_chapter_context, extract_outline_section\n', 1)

          start = text.index('def build_clean_context_sections(')
          end = text.index('\ndef build_full_rewrite_prompt', start)
          new_fn = '''def build_clean_context_sections(worker, chapter_num: int, selection_source: str = "") -> str:\n    """Assemble scoped canon context for the target chapter only."""\n    project = worker.project\n    chapter_outline = extract_outline_section(project.outline, chapter_num) or "(no outline entry for this chapter)"\n    source = "\\n\\n".join(part for part in (chapter_outline, selection_source) if part)\n    characters, world = build_relevant_chapter_context(\n        project, source, max_character_chars=5000, max_world_chars=6000\n    )\n\n    sections = []\n    if characters:\n        sections.append(prompts.render(\n            "change_chapter/section",\n            heading="RELEVANT CHARACTERS (project canon — use only these established records)",\n            body=characters,\n        ))\n    if world:\n        sections.append(prompts.render(\n            "change_chapter/section",\n            heading="RELEVANT WORLD & SETTING (project canon — scoped to this chapter)",\n            body=world,\n        ))\n    intent_frag = project.author_intent.to_prompt_fragment()\n    style_frag = project.writing_style.to_prompt_fragment()\n    if intent_frag:\n        sections.append(prompts.render("change_chapter/section", heading="AUTHOR INTENT", body=intent_frag))\n    if style_frag:\n        sections.append(prompts.render("change_chapter/section", heading="WRITING STYLE", body=style_frag))\n    sections.append(prompts.render("change_chapter/section", heading="CURRENT CHAPTER PLAN", body=chapter_outline))\n    return "\\n\\n".join(sections)\n'''
          text = text[:start] + new_fn.rstrip() + '\n\n' + text[end:]

          old = '        context_sections=build_clean_context_sections(worker, chapter_num),\n'
          new = '        context_sections=build_clean_context_sections(worker, chapter_num, "\\n\\n".join((instruction, checklist, chapter_content))),\n'
          if old not in text:
              raise SystemExit('Change full rewrite context call not found')
          text = text.replace(old, new, 1)

          start = text.index('def _build_continuation_prompt(')
          end = text.index('\ndef trim_leading_overlap', start)
          fn = text[start:end]
          old = '''    characters_raw = (format_characters_block(project.characters[:12]) or "(none)").strip()\n    world_raw      = _cap(project.world, 8000, "world notes") or "(none)"\n    prose_tail_raw = chapter_content.strip()\n'''
          new = '''    prose_tail_raw = chapter_content.strip()\n    selection_source = "\\n\\n".join(\n        part for part in (outline_raw, instruction, checklist, missing_text, prose_tail_raw) if part\n    )\n    characters_raw, world_raw = build_relevant_chapter_context(\n        project, selection_source, max_character_chars=5000, max_world_chars=6000\n    )\n'''
          if old not in fn:
              raise SystemExit('Change continuation raw context block not found')
          fn = fn.replace(old, new, 1)
          text = text[:start] + fn + text[end:]
          p.write_text(text, encoding='utf-8')

          # Prompt wording: Memory and UI/chat history are explicitly out of writer context.
          p = Path('engine/prompts/write_chapter/continuation_user.txt')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'established characters and relationships, world/setting, story memory, or the text already written.',
              'established characters and relationships, scoped world/setting, or the text already written.',
          )
          p.write_text(text, encoding='utf-8')

          # Syntax checks.
          for path in ('engine/context.py', 'engine/workflow.py', 'engine/change_chapter.py'):
              compile(Path(path).read_text(encoding='utf-8'), path, 'exec')

          helper = Path('.github/workflows/_scope_chapter_context.yml')
          helper.unlink()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'engine/context.py', 'engine/workflow.py', 'engine/change_chapter.py', 'engine/prompts/write_chapter/continuation_user.txt', str(helper)], check=True)
          subprocess.run(['git', 'commit', '-m', 'refactor: scope chapter context to relevant canon'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:bugfixes'], check=True)
          PY
