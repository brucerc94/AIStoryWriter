        self.assertNotIn("Manolo", result)

    def test_world_sections_are_scoped(self):
        world = """# World

## Geography
La Guarderia sits beside the maize fields and the old baptismal font.

## Culture & Customs
Santa Clara celebrates the Harvest Moon Festival each year.

## History
The village was founded beside an ancient church.
"""
        result = select_relevant_world(world, "Raul searches the baptismal font beside the maize fields.", max_sections=2)
        self.assertIn("Geography", result)
        self.assertNotIn("Culture & Customs", result)

    def test_writer_context_does_not_depend_on_memory_or_chat(self):
        project = Project(title="Test")
        project.characters = [self.make_character("Raul")]
        project.world = "## Geography\nThe village has maize fields."
