name: Scope Chapter Context
on:
  push:
    branches:
      - bugfixes
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_scoped_chapter_context.py
