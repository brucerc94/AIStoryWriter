from types import SimpleNamespace

from engine.context import build_relevant_chapter_context, select_relevant_characters, select_relevant_world
from engine.models import Project, TaskType


class ScopedChapterContextTests(unittest.TestCase):
    def make_character(self, name, role="supporting", description=""):
        return SimpleNamespace(name=name, role=role, description=description, backstory="", traits=[], relationships=[])

    def test_only_named_characters_are_selected(self):
        chars = [
