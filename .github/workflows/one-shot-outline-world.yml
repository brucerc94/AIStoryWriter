name: one-shot-outline-world

on:
  push:
    branches: [bugfixes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/context.py")
          text = path.read_text(encoding="utf-8")

          old_render = '''        if task == TaskType.GENERATE_OUTLINE:\n            # Synopsis is normally in the user message for outline generation.\n            if sections["Characters"]:\n                parts.append(f"\\n\\n## Established Characters\\n{sections['Characters']}")\n            if sections["Creative Direction"]:\n                parts.append(f"\\n\\n## Author's Creative Direction\\n{sections['Creative Direction']}")\n'''
          new_render = '''        if task == TaskType.GENERATE_OUTLINE:\n            # Synopsis is normally in the user message for outline generation.\n            # Characters and World are reference canon for planning; keep them\n            # compact so the detailed task prompt remains available.\n            if sections["Characters"]:\n                parts.append(f"\\n\\n## Established Characters\\n{sections['Characters']}")\n            if sections["World"]:\n                parts.append(f"\\n\\n## World & Setting\\n{sections['World']}")\n            if sections["Creative Direction"]:\n                parts.append(f"\\n\\n## Author's Creative Direction\\n{sections['Creative Direction']}")\n'''

          old_budget = '''            "Characters": max(220, min(700, max_context_tokens // 7)),\n            "Outline": 0,\n            "World": 0,\n            "Memory": 0,\n            "Chat Summary": 0,\n            "Creative Direction": max(120, min(360, max_context_tokens // 12)),\n'''
          new_budget = '''            "Characters": max(220, min(700, max_context_tokens // 8)),\n            "Outline": 0,\n            "World": max(180, min(500, max_context_tokens // 10)),\n            "Memory": 0,\n            "Chat Summary": 0,\n            "Creative Direction": max(120, min(360, max_context_tokens // 12)),\n'''

          if old_render not in text:
              raise SystemExit("Expected Generate Outline render block not found")
          if old_budget not in text:
              raise SystemExit("Expected Generate Outline budget block not found")

          text = text.replace(old_render, new_render, 1)
          text = text.replace(old_budget, new_budget, 1)
          path.write_text(text, encoding="utf-8")

          # Add a focused regression test without changing the existing test suite structure.
          test_path = Path("tests/test_outline_world_context.py")
          test_path.write_text('''import unittest\n\nfrom engine.context import build_context_for_model, build_system_prompt\nfrom engine.models import Project, TaskType\n\n\nclass OutlineWorldContextTests(unittest.TestCase):\n    def test_generate_outline_includes_world_reference(self):\n        project = Project(\n            title="Test",\n            synopsis="Synopsis",\n            world="## Geography\\nThe village has an established river boundary.",\n        )\n        system_prompt = build_system_prompt(project, TaskType.GENERATE_OUTLINE)\n        messages = build_context_for_model(\n            project,\n            "Generate the outline.\\n\\nSynopsis: Synopsis",\n            system_prompt,\n            max_context_tokens=4096,\n            task=TaskType.GENERATE_OUTLINE,\n            reply_reserved=512,\n        )\n        self.assertIn("The village has an established river boundary.", messages[0]["content"])\n        self.assertIn("## World & Setting", messages[0]["content"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

          python -m unittest tests/test_outline_world_context.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/context.py tests/test_outline_world_context.py .github/workflows/one-shot-outline-world.yml
          git rm .github/workflows/one-shot-outline-world.yml
          git commit -m "fix: include world context in outline generation"
          git push origin HEAD:bugfixes
