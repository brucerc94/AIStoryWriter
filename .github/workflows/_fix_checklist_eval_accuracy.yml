name: Fix checklist evaluator accuracy
on:
  push:
    branches:
      - bugfixes
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0
      - name: Remove prior-state priming from checklist evaluator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          change_prompt = Path('engine/prompts/change_chapter/eval_user.txt')
          write_prompt = Path('engine/prompts/write_chapter/eval_user.txt')

          change_text = change_prompt.read_text(encoding='utf-8')
          write_text = write_prompt.read_text(encoding='utf-8')

          change_old = '''PRIOR CHECKLIST STATE — PERSISTENT:\nConfirmed complete IDs from earlier passes: {{prior_done_ids}}\nThese items were already satisfied in the current rewrite and must not be regressed to pending unless the current chapter text actually contradicts or removes them.\n\n'''
          change_new = '''CURRENT DRAFT IS THE ONLY AUTHORITATIVE STATE:\nEvaluate every checklist item from the actual current chapter text. Do not assume an item is complete because an earlier pass said it was complete. A requirement is DONE only when the current draft actually satisfies it. Items that have not happened yet must remain in MISSING, even during an append-only continuation.\n\n'''
          if change_old not in change_text:
              raise SystemExit('change_chapter prior-state block not found')
          change_text = change_text.replace(change_old, change_new, 1)
          change_text = change_text.replace(
              'Evaluate every checklist item one by one. Do not return complete=true unless EVERY ID in [{{id_list}}] is in done and missing is empty. Treat the prior confirmed IDs as already complete for this append-only continuation workflow, then identify only requirements that remain genuinely unsatisfied.',
              'Evaluate every checklist item one by one against the CURRENT FULL CHAPTER. Do not return complete=true unless EVERY ID in [{{id_list}}] is in done and missing is empty. Never mark an item done merely because a previous pass marked it done; the requirement must actually be satisfied in the current draft.',
              1,
          )

          write_old = '''PRIOR CHECKLIST STATE — PERSISTENT:\nConfirmed complete IDs from earlier passes: {{prior_done_ids}}\nThese items were already satisfied in the current chapter and must not be regressed to pending unless the current draft actually contradicts or removes them.\n\n'''
          write_new = '''CURRENT DRAFT IS THE ONLY AUTHORITATIVE STATE:\nEvaluate every checklist item from the actual current chapter text. Do not assume an item is complete because an earlier pass said it was complete. A requirement is DONE only when the current draft actually satisfies it. Items that have not happened yet must remain in MISSING, even during an append-only continuation.\n\n'''
          if write_old not in write_text:
              raise SystemExit('write_chapter prior-state block not found')
          write_text = write_text.replace(write_old, write_new, 1)
          write_text = write_text.replace(
              'Evaluate every checklist item one by one. Do not return complete=true unless EVERY ID in [{{id_list}}] is in done and missing is empty. Treat prior confirmed IDs as already complete for this append-only continuation workflow, then identify only requirements that remain genuinely unsatisfied.',
              'Evaluate every checklist item one by one against the CURRENT CHAPTER DRAFT. Do not return complete=true unless EVERY ID in [{{id_list}}] is in done and missing is empty. Never mark an item done merely because a previous pass marked it done; the requirement must actually be satisfied in the current draft.',
              1,
          )

          code_path = Path('engine/change_chapter.py')
          code = code_path.read_text(encoding='utf-8')

          start = code.find('def _reconcile_checklist_progress(')
          end = code.find('\ndef build_clean_context_sections(', start)
          if start < 0 or end < 0:
              raise SystemExit('reconcile function boundaries not found')

          new_reconcile = '''def _reconcile_checklist_progress(result: dict, checklist: str, prior_done_ids: set[int] | None = None) -> dict:\n    \"\"\"Reconcile checklist progress without allowing stale state to override the current draft.\"\"\"\n    expected = dict(parse_checklist_items(checklist))\n    prior = set(prior_done_ids or ())\n    current_done = set(result.get("done_ids", []))\n    current_missing = set(result.get("missing_ids", []))\n\n    # The evaluator's current assessment of the full accumulated chapter is\n    # authoritative. Prior done IDs are used only as a fallback when the\n    # evaluator omitted an item entirely; an explicit current missing result\n    # can revoke a stale prior confirmation. This prevents a bad earlier pass\n    # from permanently locking future checklist items as complete.\n    confirmed = current_done | (prior - current_missing - current_done)\n\n    filtered_missing: list[str] = []\n    for entry in result.get("missing", []) or []:\n        match = re.match(r"^\\s*(\\d+)\\s*:", str(entry))\n        if match and int(match.group(1)) in confirmed and int(match.group(1)) != 0:\n            continue\n        filtered_missing.append(str(entry).strip())\n\n    missing_ids = set(current_missing)\n    # If the current evaluator failed to account for an expected ID, keep it\n    # pending unless it already has a valid current/prior confirmation.\n    for item_id, label in expected.items():\n        if item_id not in confirmed and item_id not in missing_ids:\n            missing_ids.add(item_id)\n            filtered_missing.append(f"{item_id}: {label}")\n\n    deduped_missing: list[str] = []\n    seen: set[str] = set()\n    for entry in filtered_missing:\n        if entry and entry not in seen:\n            deduped_missing.append(entry)\n            seen.add(entry)\n\n    # Never let a prior confirmation override an explicit current missing ID.\n    confirmed -= (missing_ids - {0})\n\n    result["done_ids"] = sorted(confirmed)\n    result["missing_ids"] = sorted(missing_ids)\n    result["missing"] = deduped_missing\n    result["completed"] = bool(expected) and set(expected).issubset(confirmed) and not missing_ids and not deduped_missing\n    return result\n\n'''
          code = code[:start] + new_reconcile + code[end + 1:]

          compile(change_text, 'engine/prompts/change_chapter/eval_user.txt', 'exec')
          compile(write_text, 'engine/prompts/write_chapter/eval_user.txt', 'exec')
          compile(code, 'engine/change_chapter.py', 'exec')

          change_prompt.write_text(change_text, encoding='utf-8')
          write_prompt.write_text(write_text, encoding='utf-8')
          code_path.write_text(code, encoding='utf-8')
          print('syntax OK')
          PY
      - name: Test checklist reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          spec = importlib.util.spec_from_file_location('change_chapter', 'engine/change_chapter.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          checklist = '\n'.join(f'{i}. Requirement {i}' for i in range(1, 58))
          stale = {
              'valid': True,
              'completed': True,
              'done_ids': list(range(1, 57)),
              'missing_ids': [57],
              'missing': ['57: Requirement 57'],
              'raw': '{}',
          }
          reconciled = mod._reconcile_checklist_progress(stale, checklist, set(range(1, 57)))
          assert reconciled['completed'] is False
          assert 57 in reconciled['missing_ids']
          assert all(i in reconciled['done_ids'] for i in range(1, 57))

          corrected = {
              'valid': True,
              'completed': False,
              'done_ids': list(range(1, 43)),
              'missing_ids': list(range(43, 58)),
              'missing': [f'{i}: Requirement {i}' for i in range(43, 58)],
              'raw': '{}',
          }
          reconciled = mod._reconcile_checklist_progress(corrected, checklist, set(range(1, 57)))
          assert reconciled['completed'] is False
          assert set(range(43, 58)).issubset(set(reconciled['missing_ids']))
          assert 56 not in reconciled['done_ids']
          print('reconciliation tests OK')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_fix_checklist_eval_accuracy.yml
          git add engine/change_chapter.py engine/prompts/change_chapter/eval_user.txt engine/prompts/write_chapter/eval_user.txt .github/workflows/_fix_checklist_eval_accuracy.yml
          git commit -m 'fix: make current chapter authoritative for checklist evaluation'
          git push origin HEAD:bugfixes
