name: Apply frontier consensus evaluator

on:
  push:
    branches: [bugfixes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 2

      - name: Patch source files
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          # ---------------- change_chapter.py ----------------
          p = Path('engine/change_chapter.py')
          s = p.read_text(encoding='utf-8')

          start = s.index('def parse_checklist_eval_result(')
          end = s.index('\ndef evaluate_change(', start)
          new_parse = r'''def parse_checklist_eval_result(text: str, checklist: str) -> dict:
    """Parse compact frontier-only evaluator output."""
    raw = (text or "").strip()
    expected = dict(parse_checklist_items(checklist))
    try:
        start = raw.find("{")
        end = raw.rfind("}")
        if start < 0 or end <= start:
            raise ValueError("no JSON object")
        data = json.loads(raw[start:end + 1])
        frontier_raw = data.get("furthest_completed_id")
        frontier = None if frontier_raw in (None, "", "null") else int(frontier_raw)
        if frontier is not None and frontier not in expected:
            raise ValueError(f"frontier {frontier} is not an active checklist ID")
        return {
            "valid": True,
            "completed": False,
            "frontier_id": frontier,
            "truncated": bool(data.get("truncated", False)),
            "missing": [],
            "missing_ids": [],
            "done_ids": [],
            "raw": raw,
        }
    except (ValueError, TypeError, json.JSONDecodeError) as exc:
        logger.debug("[change_chapter] Could not parse frontier evaluator JSON: %s", exc)
        return {
            "valid": False,
            "completed": False,
            "frontier_id": None,
            "truncated": False,
            "missing": [],
            "missing_ids": [],
            "done_ids": [],
            "raw": raw,
        }


def _result_from_frontier(
    frontier: int | None,
    truncated: bool,
    checklist: str,
    accumulated_done: set[int],
    active_items: list[tuple[int, str]],
) -> dict:
    """Convert one frontier into Python-owned done/missing state."""
    active_ids = [item_id for item_id, _ in active_items]
    active_expected = dict(active_items)
    if frontier is None:
        prefix_count = 0
    else:
        prefix_count = active_ids.index(frontier) + 1
    done_ids = active_ids[:prefix_count]
    missing_ids = active_ids[prefix_count:]
    missing = [f"{item_id}: {active_expected[item_id]}" for item_id in missing_ids]
    all_expected = {item_id for item_id, _ in parse_checklist_items(checklist)}
    all_confirmed = set(accumulated_done) | set(done_ids)
    completed = bool(all_expected) and all_expected.issubset(all_confirmed) and not missing_ids and not truncated
    if truncated:
        missing.append("Chapter appears truncated.")
        missing_ids = list(missing_ids) + [0]
    return {
        "valid": True,
        "completed": completed,
        "frontier_id": frontier,
        "truncated": truncated,
        "missing": missing,
        "missing_ids": sorted(set(missing_ids)),
        "done_ids": done_ids,
        "raw": "",
    }


def _frontier_vote(
    worker,
    system: str,
    user: str,
    active_checklist: str,
    max_tokens: int,
    temperature: float,
    label: str,
) -> dict:
    for attempt in range(1, MAX_CHANGE_EVAL_RETRIES + 1):
        raw = worker._run_lean_inference(
            TaskType.REVIEW_CHAPTER,
            system,
            user,
            max_tokens=max_tokens,
            temperature=temperature,
            top_p=0.95,
        )
        parsed = parse_checklist_eval_result(raw, active_checklist)
        if parsed["valid"]:
            logger.info(
                "[change_chapter] %s attempt %d/%d: frontier=%s truncated=%s",
                label, attempt, MAX_CHANGE_EVAL_RETRIES,
                parsed.get("frontier_id"), parsed.get("truncated", False),
            )
            return parsed
        logger.warning(
            "[change_chapter] %s attempt %d/%d invalid: %r",
            label, attempt, MAX_CHANGE_EVAL_RETRIES, (raw or "").strip()[:200],
        )
    return {"valid": False, "frontier_id": None, "truncated": False, "raw": ""}


def _evaluate_frontier_consensus(
    worker,
    system: str,
    user: str,
    active_items: list[tuple[int, str]],
    active_checklist: str,
    checklist: str,
    accumulated_done: set[int],
    label: str,
    max_tokens: int,
) -> dict:
    if not active_items:
        return _result_from_frontier(None, False, checklist, accumulated_done, active_items)

    system_b = (
        system
        + "\\n\\nINDEPENDENT SECOND EVALUATION: Re-read the chapter endpoint from scratch. "
          "Be skeptical and conservative. Identify only the furthest ordered checklist "
          "step actually reached."
    )
    votes = [
        _frontier_vote(worker, system, active_checklist and user, active_checklist, max_tokens, 0.10, f"{label}:A"),
        _frontier_vote(worker, system_b, user, active_checklist, max_tokens, 0.20, f"{label}:B"),
    ]
    valid_votes = [v for v in votes if v.get("valid")]

    if len(valid_votes) < 2 or valid_votes[0].get("frontier_id") != valid_votes[1].get("frontier_id"):
        system_c = (
            system
            + "\\n\\nTHIRD TIE-BREAK EVALUATION: Determine the furthest ordered checklist "
              "step actually reached at the chapter endpoint. Prefer an earlier step when uncertain."
        )
        votes.append(_frontier_vote(worker, system_c, user, active_checklist, max_tokens, 0.15, f"{label}:C"))
        valid_votes = [v for v in votes if v.get("valid")]

    if not valid_votes:
        return {
            "valid": False, "completed": False, "frontier_id": None,
            "truncated": False, "missing": [], "missing_ids": [], "done_ids": [], "raw": "",
        }

    frontiers = [v.get("frontier_id") for v in valid_votes]
    counts = {}
    for frontier in frontiers:
        counts[frontier] = counts.get(frontier, 0) + 1
    best_count = max(counts.values())
    candidates = [frontier for frontier, count in counts.items() if count == best_count]

    if len(candidates) == 1:
        chosen = candidates[0]
    else:
        order = {None: -1, **{item_id: idx for idx, (item_id, _) in enumerate(active_items)}}
        chosen = min(candidates, key=lambda value: order.get(value, -1))

    truncated = any(v.get("truncated", False) for v in valid_votes if v.get("frontier_id") == chosen)
    result = _result_from_frontier(chosen, truncated, checklist, accumulated_done, active_items)
    result["raw"] = " | ".join(v.get("raw", "") for v in valid_votes)
    logger.info("[change_chapter] frontier consensus: votes=%s chosen=%s truncated=%s", frontiers, chosen, truncated)
    return result
'''
          s = s[:start] + new_parse + s[end:]

          def replace_function(src: str, name: str, next_name: str, body: str) -> str:
              start = src.index(f"def {name}(")
              end = src.index(f"\ndef {next_name}(", start)
              return src[:start] + body.rstrip() + "\n" + src[end + 1:]

          new_eval_change = r'''def evaluate_change(
    worker,
    chapter_num: int,
    chapter_content: str,
    checklist: str,
    pass_number: int,
    accumulated_done: set[int] | None = None,
) -> dict:
    accumulated = set(accumulated_done or ())
    system, user, active_items = _build_eval_prompt(worker, chapter_num, chapter_content, checklist, accumulated)
    active_checklist = "\n".join(f"{iid}. {txt}" for iid, txt in active_items)
    max_eval_tokens = min(128, max(64, 32 + len(active_items) * 4))
    final = _evaluate_frontier_consensus(
        worker, system, user, active_items, active_checklist, checklist,
        accumulated, "change_chapter", max_eval_tokens,
    )
    if not final["valid"]:
        worker.step_started.emit(
            f"Change Chapter verification — PARSE FAILURE (pass {pass_number}); evaluator returned no valid frontier."
        )
        return final
    if final["completed"]:
        worker.step_started.emit(f"Change Chapter verification — COMPLETE (pass {pass_number})")
    else:
        missing_text = "\n".join(f"- {item}" for item in final["missing"])
        worker.step_started.emit(
            f"Change Chapter verification — INCOMPLETE (pass {pass_number})\n"
            f"Missing:\n{missing_text or '- evaluator did not identify specific items'}"
        )
    return final
'''
          s = replace_function(s, "evaluate_change", "ends_abruptly", new_eval_change)

          new_eval_chapter = r'''def evaluate_chapter(
    worker,
    chapter_num: int,
    chapter_title: str,
    chapter_content: str,
    checklist: str,
    pass_number: int,
    accumulated_done: set[int] | None = None,
) -> dict:
    accumulated = set(accumulated_done or ())
    system, user, active_items = _build_chapter_eval_prompt(
        chapter_num, chapter_title, chapter_content, checklist, accumulated
    )
    active_checklist = "\n".join(f"{iid}. {txt}" for iid, txt in active_items)
    max_eval_tokens = min(128, max(64, 32 + len(active_items) * 4))
    final = _evaluate_frontier_consensus(
        worker, system, user, active_items, active_checklist, checklist,
        accumulated, "write_chapter", max_eval_tokens,
    )
    if not final["valid"]:
        worker.step_started.emit(
            f"Write Chapter verification — PARSE FAILURE (pass {pass_number}); evaluator returned no valid frontier."
        )
        return final
    if final["completed"]:
        worker.step_started.emit(f"Write Chapter verification — COMPLETE (pass {pass_number})")
    else:
        missing_text = "\n".join(f"- {item}" for item in final["missing"])
        worker.step_started.emit(
            f"Write Chapter verification — INCOMPLETE (pass {pass_number})\n"
            f"Missing:\n{missing_text or '- evaluator did not identify specific items'}"
        )
    return final
'''
          # evaluate_chapter is after plan_chapter and before later helpers.
          start = s.index('def evaluate_chapter(')
          end = s.index('\ndef ', start + 5)
          s = s[:start] + new_eval_chapter.rstrip() + '\n' + s[end + 1:]
          p.write_text(s, encoding='utf-8')

          # ---------------- workflow.py ----------------
          p = Path('engine/workflow.py')
          s = p.read_text(encoding='utf-8')
          old_sig = '''    def _run_lean_inference(\n        self,\n        task: TaskType,\n        system_content: str,\n        user_content: str,\n        max_tokens: int = 500,\n    ) -> str:\n'''
          new_sig = '''    def _run_lean_inference(\n        self,\n        task: TaskType,\n        system_content: str,\n        user_content: str,\n        max_tokens: int = 500,\n        temperature: float | None = None,\n        top_p: float | None = None,\n        top_k: int | None = None,\n    ) -> str:\n'''
          if old_sig not in s:
              raise SystemExit('workflow inference signature not found')
          s = s.replace(old_sig, new_sig, 1)
          old_sampling = '''        temperature = self._task_temperature(task)\n        top_p = self._task_top_p(task)\n        top_k = self._task_top_k(task)\n'''
          new_sampling = '''        temperature = self._task_temperature(task) if temperature is None else temperature\n        top_p = self._task_top_p(task) if top_p is None else top_p\n        top_k = self._task_top_k(task) if top_k is None else top_k\n'''
          if old_sampling not in s:
              raise SystemExit('workflow sampling block not found')
          s = s.replace(old_sampling, new_sampling, 1)
          p.write_text(s, encoding='utf-8')

          # ---------------- evaluator prompt templates ----------------
          system_text = '''You are a strict ordered-progress evaluator for a novel chapter. The checklist is an ORDERED NARRATIVE EXECUTION SEQUENCE. Determine the single furthest checklist ID that the CURRENT CHAPTER TEXT has actually reached at its narrative endpoint. Do not report individual done IDs. A later item does NOT count merely because its event or outcome appears earlier, in a flashback, as foreshadowing, in dialogue, in a summary, or out of sequence. Stop at the first active item not actually reached/completed in order. If no active item was reached, use null. If the chapter is truncated or cut off, set truncated=true. Return ONLY compact valid JSON: {"furthest_completed_id":N|null,"truncated":true|false}. Only the current chapter text establishes completion; do not infer from outline, synopsis, memory, canon, or prior state.'''
          Path('engine/prompts/change_chapter/eval_system.txt').write_text(system_text, encoding='utf-8')
          Path('engine/prompts/write_chapter/eval_system.txt').write_text(system_text.replace('novel chapter.', 'novel chapter.'), encoding='utf-8')

          Path('engine/prompts/change_chapter/eval_user.txt').write_text('''Chapter {{chapter_number}}: '{{chapter_title}}'\n\nACTIVE CHECKLIST ITEMS — ORDERED NARRATIVE STEPS:\n{{checklist_items}}\n\nCURRENT FULL CHAPTER:\n{{chapter_content}}\n\nFind the furthest active checklist ID actually completed in order by the END of the current chapter. Be conservative: when uncertain between two IDs, choose the earlier one. A character, event, detail, or outcome that appears before its required position does not advance the frontier. Return only the required JSON object.''', encoding='utf-8')
          Path('engine/prompts/write_chapter/eval_user.txt').write_text('''Chapter {{chapter_number}}: '{{chapter_title}}'\n\nACTIVE CHECKLIST ITEMS — ORDERED NARRATIVE STEPS:\n{{checklist_items}}\n\nCURRENT CHAPTER DRAFT:\n{{chapter_content}}\n\nFind the furthest active checklist ID actually completed in order by the END of the current draft. Be conservative: when uncertain between two IDs, choose the earlier one. A character, event, detail, or outcome that appears before its required position does not advance the frontier. Return only the required JSON object.''', encoding='utf-8')

          # Remove the temporary patch workflows from the final tree.
          for name in (
              '.github/workflows/_apply_frontier_consensus.yml',
              '.github/workflows/z_apply_frontier_consensus.yml',
              '.github/workflows/z2_apply_frontier_consensus.yml',
          ):
              Path(name).unlink(missing_ok=True)

          print('PATCH_OK')
          PY
          python /tmp/patch.py

      - name: Commit final fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/change_chapter.py engine/workflow.py engine/prompts/change_chapter/eval_system.txt engine/prompts/change_chapter/eval_user.txt engine/prompts/write_chapter/eval_system.txt engine/prompts/write_chapter/eval_user.txt .github/workflows/_apply_frontier_consensus.yml .github/workflows/z_apply_frontier_consensus.yml .github/workflows/z2_apply_frontier_consensus.yml
          git commit -m "fix: use frontier consensus evaluator"
          git push origin bugfixes
