name: Apply Change Chapter Context Cleanup

on:
  push:
    branches: [bugfixes]
    paths:
      - .github/workflows/_remove_change_prev_summary_v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0

      - name: Apply cleanup
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('engine/change_chapter.py')
          text = p.read_text(encoding='utf-8')

          # Remove previous-chapter summary constant + function.
          start = text.index('\nPREV_CHAPTER_CAP = 14000')
          end = text.index('\ndef plan_change', start)
          text = text[:start] + '\n' + text[end:]

          # Remove the previous summary from the clean-context function.
          start = text.index('\ndef build_clean_context_sections(')
          end = text.index('\ndef build_full_rewrite_prompt(', start)
          new_context = '''\ndef build_clean_context_sections(worker, chapter_num: int) -> str:\n    """Assemble clean context for the target chapter only."""\n    project = worker.project\n\n    characters = format_characters_block(project.characters[:12]) or "(none)"\n    world = _cap(project.world, WORLD_CAP, "world notes") or "(none)"\n    memory = _cap(project.memory, MEMORY_CAP, "story memory") or "(none)"\n    intent_frag = project.author_intent.to_prompt_fragment()\n    style_frag = project.writing_style.to_prompt_fragment()\n    chapter_outline = extract_outline_section(project.outline, chapter_num) or "(no outline entry for this chapter)"\n\n    sections = [\n        prompts.render("change_chapter/section", heading="CHARACTERS", body=characters),\n    ]\n    if world != "(none)":\n        sections.append(prompts.render("change_chapter/section", heading="WORLD & SETTING", body=world))\n    if memory != "(none)":\n        sections.append(prompts.render("change_chapter/section", heading="STORY MEMORY", body=memory))\n    if intent_frag:\n        sections.append(prompts.render("change_chapter/section", heading="AUTHOR INTENT", body=intent_frag))\n    if style_frag:\n        sections.append(prompts.render("change_chapter/section", heading="WRITING STYLE", body=style_frag))\n    sections.append(prompts.render("change_chapter/section", heading="CURRENT CHAPTER PLAN", body=chapter_outline))\n    return "\\n\\n".join(sections)\n\n'''
          text = text[:start] + new_context + text[end:]

          # Remove prev_summary from full rewrite helper.
          start = text.index('\ndef build_full_rewrite_prompt(')
          end = text.index('\ndef _build_eval_prompt(', start)
          new_rewrite = '''\ndef build_full_rewrite_prompt(\n    worker, chapter_num: int, chapter_content: str, instruction: str, checklist: str,\n) -> tuple[str, str]:\n    style_frag = worker.project.writing_style.to_prompt_fragment()\n    language = worker._response_language()\n\n    system = prompts.render(\n        "change_chapter/full_rewrite_system",\n        language_note=f" Write the chapter in {language}." if language else "",\n        style_block=f"\\n\\nWriting style to preserve:\\n{style_frag}" if style_frag else "",\n    )\n    user = prompts.render(\n        "change_chapter/full_rewrite_user",\n        chapter_number=chapter_num,\n        chapter_title=_chapter_title(worker, chapter_num),\n        instruction=instruction.strip(),\n        checklist=checklist.strip() or "(none; follow the original request directly)",\n        context_sections=build_clean_context_sections(worker, chapter_num),\n        chapter_content=_cap(chapter_content, CHAPTER_CAP, "part of the chapter"),\n    )\n    return system, user\n\n'''
          text = text[:start] + new_rewrite + text[end:]

          # Remove the runtime call from run().
          marker = '    prev_summary = summarize_previous_chapter(worker, chapter_num)\n'
          if marker not in text:
              raise SystemExit('runtime prev_summary assignment not found')
          text = text.replace(marker, '', 1)
          old_call = 'build_full_rewrite_prompt(worker, chapter_num, original_content, instruction, checklist, prev_summary)'
          if old_call not in text:
              raise SystemExit('prev_summary rewrite call not found')
          text = text.replace(
              old_call,
              'build_full_rewrite_prompt(worker, chapter_num, original_content, instruction, checklist)',
              1,
          )

          text = text.replace(
              'CHANGE_CHAPTER workflow: continuity summary → checklist plan → full rewrite',
              'CHANGE_CHAPTER workflow: checklist plan → full rewrite',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # Remove now-unused prompt templates.
          for q in (
              Path('engine/prompts/change_chapter/summarize_previous_chapter_system.txt'),
              Path('engine/prompts/change_chapter/summarize_previous_chapter_user.txt'),
          ):
              if q.exists():
                  q.unlink()

          # Verify only project source files; do not grep helper workflows.
          code = p.read_text(encoding='utf-8')
          if 'summarize_previous_chapter' in code or 'PREV_CHAPTER_CAP' in code or 'prev_summary' in code:
              raise SystemExit('Previous-chapter summary plumbing still remains in change_chapter.py')
          if Path('engine/prompts/change_chapter/summarize_previous_chapter_system.txt').exists():
              raise SystemExit('Old summary system prompt still exists')
          if Path('engine/prompts/change_chapter/summarize_previous_chapter_user.txt').exists():
              raise SystemExit('Old summary user prompt still exists')
          compile(code, str(p), 'exec')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'engine/change_chapter.py',
                          'engine/prompts/change_chapter/summarize_previous_chapter_system.txt',
                          'engine/prompts/change_chapter/summarize_previous_chapter_user.txt'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: remove previous chapter summary from change chapter'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:bugfixes'], check=True)
