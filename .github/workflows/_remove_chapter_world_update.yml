name: Remove chapter world updates
on:
  push:
    branches:
      - bugfixes
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0
      - name: Patch chapter workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          wf = Path('engine/workflow.py')
          text = wf.read_text(encoding='utf-8')

          write_old = '''            if chapter_accepted:\n                self._update_world_incremental(chapter_text, source_type="chapter")\n            else:\n                logger.warning(\n                    f"[write_chapter] Chapter {chapter_num} saved as INCOMPLETE — "\n                    "skipping character/world/memory updates to avoid state contamination."\n                )\n'''
          write_new = '''            if not chapter_accepted:\n                logger.warning(\n                    f"[write_chapter] Chapter {chapter_num} saved as INCOMPLETE — "\n                    "skipping canon updates because chapter generation was not accepted."\n                )\n'''
          if write_old not in text:
              raise SystemExit('Write Chapter world-update block not found')
          text = text.replace(write_old, write_new, 1)

          change_old = '''        self._update_world_incremental(chapter.content, source_type="chapter")\n        self.project.current_chapter = chapter_num\n'''
          change_new = '''        self.project.current_chapter = chapter_num\n'''
          if change_old not in text:
              raise SystemExit('Change Chapter world-update call not found')
          text = text.replace(change_old, change_new, 1)

          wf.write_text(text, encoding='utf-8')
          compile(wf.read_text(encoding='utf-8'), 'engine/workflow.py', 'exec')
          print('syntax OK')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_remove_chapter_world_update.yml
          git add engine/workflow.py .github/workflows/_remove_chapter_world_update.yml
          git commit -m 'fix: keep chapter workflows from updating world'
          git push origin HEAD:bugfixes
