name: Apply evaluator frontier fix

on:
  push:
    branches: [bugfixes]

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'fix: use frontier consensus evaluator')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: bugfixes

      - name: Apply controlled patch
        shell: python
        run: |
          from pathlib import Path
          import re

          change = Path('engine/change_chapter.py')
          text = change.read_text(encoding='utf-8')

          old_parse_start = text.index('def parse_checklist_eval_result(')
          old_parse_end = text.index('\ndef evaluate_change(', old_parse_start)
          new_parse = '''def parse_checklist_eval_result(text: str, checklist: str) -> dict:\n    """Parse the compact frontier-only evaluator response."""\n    raw = (text or '').strip()\n    expected = dict(parse_checklist_items(checklist))\n    try:\n        start = raw.find('{')\n        end = raw.rfind('}')\n        if start < 0 or end <= start:\n            raise ValueError('no JSON object')\n        data = json.loads(raw[start:end + 1])\n        frontier_raw = data.get('furthest_completed_id')\n        frontier = None if frontier_raw in (None, '', 'null') else int(frontier_raw)\n        if frontier is not None and frontier not in expected:\n            raise ValueError(f'frontier {frontier} is not an active checklist ID')\n        truncated = bool(data.get('truncated', False))\n        return {\n            'valid': True,\n            'completed': False,\n            'frontier_id': frontier,\n            'truncated': truncated,\n            'missing': [],\n            'missing_ids': [],\n            'done_ids': [],\n            'raw': raw,\n        }\n    except (ValueError, TypeError, json.JSONDecodeError) as exc:\n        logger.debug('[change_chapter] Could not parse frontier evaluator JSON: %s', exc)\n        return {\n            'valid': False, 'completed': False, 'frontier_id': None,\n            'truncated': False, 'missing': [], 'missing_ids': [],\n            'done_ids': [], 'raw': raw,\n        }\n\n\ndef _result_from_frontier(frontier: int | None, truncated: bool, checklist: str, accumulated_done: set[int], active_items: list[tuple[int, str]]) -> dict:\n    """Turn one validated frontier into the complete Python-owned checklist state."""\n    active_ids = [item_id for item_id, _ in active_items]\n    active_expected = dict(active_items)\n    if frontier is None:\n        prefix_count = 0\n    else:\n        try:\n            prefix_count = active_ids.index(frontier) + 1\n        except ValueError:\n            prefix_count = 0\n    done_ids = active_ids[:prefix_count]\n    missing_ids = active_ids[prefix_count:]\n    missing = [f'{item_id}: {active_expected[item_id]}' for item_id in missing_ids]\n    all_expected = {item_id for item_id, _ in parse_checklist_items(checklist)}\n    all_confirmed = set(accumulated_done) | set(done_ids)\n    completed = bool(all_expected) and all_expected.issubset(all_confirmed) and not missing_ids and not truncated\n    if truncated:\n        missing.append('Chapter appears truncated.')\n        missing_ids = list(missing_ids) + [0]\n    return {\n        'valid': True,\n        'completed': completed,\n        'frontier_id': frontier,\n        'truncated': truncated,\n        'missing': missing,\n        'missing_ids': sorted(set(missing_ids)),\n        'done_ids': done_ids,\n        'raw': '',\n    }\n\n\ndef _frontier_vote(worker, system: str, user: str, active_checklist: str, max_tokens: int, temperature: float, label: str) -> dict:\n    """Run one independent frontier evaluator vote, retrying only malformed output."""\n    for attempt in range(1, MAX_CHANGE_EVAL_RETRIES + 1):\n        raw = worker._run_lean_inference(\n            TaskType.REVIEW_CHAPTER,\n            system,\n            user,\n            max_tokens=max_tokens,\n            temperature=temperature,\n            top_p=0.95,\n        )\n        parsed = parse_checklist_eval_result(raw, active_checklist)\n        if parsed['valid']:\n            logger.info(\n                '[%s] evaluator vote %s attempt %d: frontier=%s truncated=%s',\n                label, label, attempt, parsed.get('frontier_id'), parsed.get('truncated', False),\n            )\n            return parsed\n        logger.warning(\n            '[%s] evaluator vote %s attempt %d/%d invalid: %r',\n            label, label, attempt, MAX_CHANGE_EVAL_RETRIES, (raw or '').strip()[:200],\n        )\n    return {'valid': False, 'frontier_id': None, 'truncated': False, 'raw': ''}\n\n\ndef _evaluate_frontier_consensus(worker, system: str, user: str, active_items: list[tuple[int, str]], active_checklist: str, checklist: str, accumulated_done: set[int], label: str, max_tokens: int) -> dict:\n    """Obtain two independent frontier votes; add a third only when they disagree."""\n    if not active_items:\n        return _result_from_frontier(None, False, checklist, accumulated_done, active_items)\n\n    system_b = system + '\\n\\nINDEPENDENT SECOND EVALUATION: be skeptical. Re-read the chapter endpoint and locate the exact final ordered checklist step actually reached. Do not assume later items occurred.'\n    votes = [\n        _frontier_vote(worker, system, user, active_checklist, max_tokens, 0.10, f'{label}:A'),\n        _frontier_vote(worker, system_b, user, active_checklist, max_tokens, 0.20, f'{label}:B'),\n    ]\n    valid_votes = [v for v in votes if v.get('valid')]\n\n    if len(valid_votes) >= 2 and valid_votes[0].get('frontier_id') != valid_votes[1].get('frontier_id'):\n        system_c = system + '\\n\\nTHIRD TIE-BREAK EVALUATION: independently determine the furthest checklist step actually reached at the chapter endpoint. Be conservative; choose an earlier step rather than guessing a later one.'\n        votes.append(_frontier_vote(worker, system_c, user, active_checklist, max_tokens, 0.15, f'{label}:C'))\n        valid_votes = [v for v in votes if v.get('valid')]\n\n    if not valid_votes:\n        return {'valid': False, 'completed': False, 'frontier_id': None, 'truncated': False, 'missing': [], 'missing_ids': [], 'done_ids': [], 'raw': ''}\n\n    frontiers = [v.get('frontier_id') for v in valid_votes]\n    counts = {}\n    for frontier in frontiers:\n        counts[frontier] = counts.get(frontier, 0) + 1\n    best_count = max(counts.values())\n    candidates = [frontier for frontier, count in counts.items() if count == best_count]\n    chosen = min(candidates, key=lambda x: -1 if x is None else x) if len(candidates) > 1 else candidates[0]\n    # Conservative tie-break: when no majority exists, choose the earliest valid frontier.\n    if len(candidates) > 1:\n        ordered_ids = [item_id for item_id, _ in active_items]\n        rank = {None: -1, **{item_id: index for index, item_id in enumerate(ordered_ids)}}\n        chosen = min(candidates, key=lambda value: rank.get(value, -1))\n\n    truncated = any(v.get('truncated', False) for v in valid_votes if v.get('frontier_id') == chosen)\n    result = _result_from_frontier(chosen, truncated, checklist, accumulated_done, active_items)\n    result['raw'] = ' | '.join(v.get('raw', '') for v in valid_votes)\n    logger.info(\n        '[%s] frontier consensus: votes=%s chosen=%s truncated=%s',\n        label, frontiers, chosen, truncated,\n    )\n    return result\n'''
          text = text[:old_parse_start] + new_parse + text[old_parse_end:]

          def replace_function(src, name, next_name, new_body):
              start = src.index(f'def {name}(')
              end = src.index(f'\ndef {next_name}(', start)
              return src[:start] + new_body.rstrip() + '\n' + src[end+1:]

          new_eval_change = '''def evaluate_change(\n    worker, chapter_num: int, chapter_content: str, checklist: str, pass_number: int,\n    accumulated_done: set[int] | None = None,\n) -> dict:\n    """Evaluate the active checklist using two independent frontier votes."""\n    accumulated = set(accumulated_done or ())\n    system, user, active_items = _build_eval_prompt(worker, chapter_num, chapter_content, checklist, accumulated)\n    active_count = len(active_items)\n    logger.info(\n        '[change_chapter] Chapter %d — verification pass %d — %d words — active window: %d item(s).',\n        chapter_num, pass_number, len(chapter_content.split()), active_count,\n    )\n    active_checklist = '\\n'.join(f'{iid}. {txt}' for iid, txt in active_items)\n    max_eval_tokens = min(128, max(64, 32 + active_count * 4))\n    final = _evaluate_frontier_consensus(\n        worker, system, user, active_items, active_checklist, checklist, accumulated,\n        'change_chapter', max_eval_tokens,\n    )\n    if not final['valid']:\n        worker.step_started.emit(\n            f'Change Chapter verification — PARSE FAILURE (pass {pass_number}); evaluator returned no valid frontier.'\n        )\n        return final\n    if final['completed']:\n        worker.step_started.emit(f'Change Chapter verification — COMPLETE (pass {pass_number})')\n    else:\n        missing_text = '\\n'.join(f'- {item}' for item in final['missing'])\n        worker.step_started.emit(\n            f'Change Chapter verification — INCOMPLETE (pass {pass_number})\\nMissing:\\n{missing_text or "- evaluator did not identify specific items"}'\n        )\n    return final\n'''
          text = replace_function(text, 'evaluate_change', 'ends_abruptly', new_eval_change)

          # Replace Write Chapter evaluator in the same module.
          new_eval_chapter = '''def evaluate_chapter(\n    worker, chapter_num: int, chapter_title: str, chapter_content: str, checklist: str,\n    pass_number: int, accumulated_done: set[int] | None = None,\n) -> dict:\n    """Evaluate the WRITE_CHAPTER active checklist using two frontier votes."""\n    accumulated = set(accumulated_done or ())\n    system, user, active_items = _build_chapter_eval_prompt(\n        chapter_num, chapter_title, chapter_content, checklist, accumulated\n    )\n    active_count = len(active_items)\n    logger.info(\n        '[write_chapter] Chapter %d — checklist verification pass %d — %d words — active window: %d item(s).',\n        chapter_num, pass_number, len(chapter_content.split()), active_count,\n    )\n    active_checklist = '\\n'.join(f'{iid}. {txt}' for iid, txt in active_items)\n    max_eval_tokens = min(128, max(64, 32 + active_count * 4))\n    final = _evaluate_frontier_consensus(\n        worker, system, user, active_items, active_checklist, checklist, accumulated,\n        'write_chapter', max_eval_tokens,\n    )\n    if not final['valid']:\n        worker.step_started.emit(\n            f'Write Chapter verification — PARSE FAILURE (pass {pass_number}); evaluator returned no valid frontier.'\n        )\n        return final\n    if final['completed']:\n        worker.step_started.emit(f'Write Chapter verification — COMPLETE (pass {pass_number})')\n    else:\n        missing_text = '\\n'.join(f'- {item}' for item in final['missing'])\n        worker.step_started.emit(\n            f'Write Chapter verification — INCOMPLETE (pass {pass_number})\\nMissing:\\n{missing_text or "- evaluator did not identify specific items"}'\n        )\n    return final\n'''
          # There is a single evaluate_chapter definition after plan_chapter; replace through the next function.
          start = text.index('def evaluate_chapter(')
          end = text.index('\ndef ', start + 5)
          text = text[:start] + new_eval_chapter.rstrip() + '\n' + text[end+1:]

          if 'done MUST be a contiguous prefix' in text:
              raise SystemExit('old evaluator code still present after patch')

          change.write_text(text, encoding='utf-8')

          # Add optional sampling overrides to workflow._run_lean_inference.
          wf = Path('engine/workflow.py')
          wtext = wf.read_text(encoding='utf-8')
          old_sig = '''    def _run_lean_inference(\n        self,\n        task: TaskType,\n        system_content: str,\n        user_content: str,\n        max_tokens: int = 500,\n    ) -> str:\n'''
          new_sig = '''    def _run_lean_inference(\n        self,\n        task: TaskType,\n        system_content: str,\n        user_content: str,\n        max_tokens: int = 500,\n        temperature: float | None = None,\n        top_p: float | None = None,\n        top_k: int | None = None,\n    ) -> str:\n'''
          if old_sig not in wtext:
              raise SystemExit('workflow inference signature not found')
          wtext = wtext.replace(old_sig, new_sig, 1)
          old_sampling = '''        temperature = self._task_temperature(task)\n        top_p = self._task_top_p(task)\n        top_k = self._task_top_k(task)\n'''
          new_sampling = '''        temperature = self._task_temperature(task) if temperature is None else temperature\n        top_p = self._task_top_p(task) if top_p is None else top_p\n        top_k = self._task_top_k(task) if top_k is None else top_k\n'''
          if old_sampling not in wtext:
              raise SystemExit('workflow sampling block not found')
          wtext = wtext.replace(old_sampling, new_sampling, 1)
          wf.write_text(wtext, encoding='utf-8')

          # Update evaluator templates to frontier-only output.
          eval_system = Path('engine/prompts/change_chapter/eval_system.txt')
          eval_user = Path('engine/prompts/change_chapter/eval_user.txt')
          write_system = Path('engine/prompts/write_chapter/eval_system.txt')
          write_user = Path('engine/prompts/write_chapter/eval_user.txt')

          system_text = '''You are a strict ordered-progress evaluator for a novel chapter. The checklist is an ORDERED NARRATIVE EXECUTION SEQUENCE. Determine the single furthest checklist ID that the CURRENT CHAPTER TEXT has actually reached at its narrative endpoint. Do not report individual done IDs. A later item does NOT count merely because its event or outcome appears earlier, in a flashback, as foreshadowing, in dialogue, in a summary, or out of sequence. Stop at the first active item not actually reached/completed in order. If no active item was reached, use null. If the chapter is truncated or cut off, set truncated=true. Return ONLY compact valid JSON: {"furthest_completed_id":N|null,"truncated":true|false}. Only the current chapter text establishes completion; do not infer from outline, synopsis, memory, canon, or prior state.''' 
          user_text_change = '''Chapter {{chapter_number}}: '{{chapter_title}}'\n\nACTIVE CHECKLIST ITEMS — ORDERED NARRATIVE STEPS:\n{{checklist_items}}\n\nCURRENT FULL CHAPTER:\n{{chapter_content}}\n\nFind the furthest active checklist ID actually completed in order by the END of the current chapter. Be conservative: when uncertain between two IDs, choose the earlier one. A character/event/detail that appears before its required position does not advance the frontier. Return only the required JSON object.''' 
          user_text_write = '''Chapter {{chapter_number}}: '{{chapter_title}}'\n\nACTIVE CHECKLIST ITEMS — ORDERED NARRATIVE STEPS:\n{{checklist_items}}\n\nCURRENT CHAPTER DRAFT:\n{{chapter_content}}\n\nFind the furthest active checklist ID actually completed in order by the END of the current draft. Be conservative: when uncertain between two IDs, choose the earlier one. A character/event/detail that appears before its required position does not advance the frontier. Return only the required JSON object.'''
          for path, content in ((eval_system, system_text), (eval_user, user_text_change), (write_system, system_text), (write_user, user_text_write)):
              path.write_text(content, encoding='utf-8')

          # Remove this one-shot workflow before committing the real fix.
          wf_tmp = Path('.github/workflows/_apply_frontier_consensus.yml')
          if wf_tmp.exists():
              wf_tmp.unlink()

          print('PATCH_OK')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/change_chapter.py engine/workflow.py engine/prompts/change_chapter/eval_system.txt engine/prompts/change_chapter/eval_user.txt engine/prompts/write_chapter/eval_system.txt engine/prompts/write_chapter/eval_user.txt .github/workflows/_apply_frontier_consensus.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: use frontier consensus evaluator"
          git push origin bugfixes
