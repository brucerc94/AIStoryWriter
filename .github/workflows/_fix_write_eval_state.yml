name: Fix write evaluator checklist state
on:
  push:
    branches:
      - bugfixes
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0
      - name: Patch write evaluator state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('engine/change_chapter.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '''def _build_chapter_eval_prompt(\n    chapter_num: int, chapter_title: str, chapter_content: str, outline_entry: str, checklist: str,\n) -> tuple[str, str]:''',
              '''def _build_chapter_eval_prompt(\n    chapter_num: int, chapter_title: str, chapter_content: str, outline_entry: str, checklist: str,\n    prior_done_ids: set[int] | None = None,\n) -> tuple[str, str]:''',
              1,
          )
          old = '''        checklist_items=item_block,\n        chapter_content=chapter_content,\n        id_list=id_list,\n    )\n'''
          new = '''        checklist_items=item_block,\n        chapter_content=chapter_content,\n        id_list=id_list,\n        prior_done_ids=", ".join(str(i) for i in sorted(prior_done_ids or set())) or "(none)",\n    )\n'''
          if old not in text:
              raise SystemExit('write chapter eval render block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '''def evaluate_chapter(\n    worker, chapter_num: int, chapter_title: str, chapter_content: str,\n    outline_entry: str, checklist: str, pass_number: int,\n) -> dict:''',
              '''def evaluate_chapter(\n    worker, chapter_num: int, chapter_title: str, chapter_content: str,\n    outline_entry: str, checklist: str, pass_number: int,\n    prior_done_ids: set[int] | None = None,\n) -> dict:''',
              1,
          )
          old = '''    system, user = _build_chapter_eval_prompt(chapter_num, chapter_title, chapter_content, outline_entry, checklist)\n'''
          new = '''    system, user = _build_chapter_eval_prompt(\n        chapter_num, chapter_title, chapter_content, outline_entry, checklist, prior_done_ids\n    )\n'''
          if old not in text:
              raise SystemExit('write chapter evaluator call not found')
          text = text.replace(old, new, 1)

          old = '''        if parsed["valid"]:\n            final = parsed\n            logger.info(\n                "[write_chapter] Attempt %d/%d: complete=%s done=%s missing_ids=%s",\n'''
          new = '''        if parsed["valid"]:\n            final = _reconcile_checklist_progress(parsed, checklist, prior_done_ids)\n            logger.info(\n                "[write_chapter] Attempt %d/%d: complete=%s done=%s missing_ids=%s",\n'''
          if old not in text:
              raise SystemExit('write chapter parsed-result block not found')
          text = text.replace(old, new, 1)

          compile(text, 'engine/change_chapter.py', 'exec')
          print('syntax OK')
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_fix_write_eval_state.yml
          git add engine/change_chapter.py .github/workflows/_fix_write_eval_state.yml
          git commit -m 'fix: connect persistent checklist state to write evaluator'
          git push origin HEAD:bugfixes
