name: one-shot-context-size-final

on:
  push:
    branches: [bugfixes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove final context default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('engine/context.py')
          text = path.read_text(encoding='utf-8')
          old = 'max_context_tokens: int = 3200'
          if old not in text:
              raise SystemExit('Expected final context-size default not found')
          text = text.replace(old, 'max_context_tokens: int', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m unittest tests/test_context_prompt_integrity.py tests/test_outline_world_context.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-context-size-final.yml
          git add engine/context.py
          git commit -m 'fix: remove final context size default'
          git push origin HEAD:bugfixes
