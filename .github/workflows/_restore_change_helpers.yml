name: Restore Change Chapter Helpers

on:
  push:
    branches: [bugfixes]
    paths:
      - .github/workflows/_restore_change_helpers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0

      - name: Restore helpers
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('engine/change_chapter.py')
          text = p.read_text(encoding='utf-8')

          if 'def _chapter_title(' not in text:
              marker = 'MAX_CONSECUTIVE_INVALID_EVALS = 2\n'
              helper = '''\n\ndef _chapter_title(worker, chapter_num: int) -> str:\n    return next(\n        (c.title for c in worker.project.chapters if c.number == chapter_num),\n        f"Chapter {chapter_num}",\n    )\n\n\ndef _cap(text: str, limit: int, label: str) -> str:\n    text = (text or "").strip()\n    if len(text) <= limit:\n        return text\n    return f"[... earlier {label} omitted for length ...]\\n\\n" + text[-limit:]\n'''
              if marker not in text:
                  raise SystemExit('helper insertion marker not found')
              text = text.replace(marker, marker + helper, 1)

          compile(text, str(p), 'exec')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(p)], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: restore change chapter helpers'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:bugfixes'], check=True)
