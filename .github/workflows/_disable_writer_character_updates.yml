name: Disable Writer Character Updates

on:
  push:
    branches: [bugfixes]
    paths:
      - .github/workflows/_disable_writer_character_updates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfixes
          fetch-depth: 0

      - name: Remove chapter writer character updates
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('engine/workflow.py')
          text = workflow.read_text(encoding='utf-8')

          # Write Chapter: remove character extraction from accepted-chapter finalization.
          start = text.index('    def _run_write_chapter(')
          end = text.index('\n    def _run_write_book', start)
          block = text[start:end]
          old = '''            if chapter_accepted:\n                self._extract_and_merge_characters(chapter_text)\n                self._update_world_incremental(chapter_text, source_type="chapter")\n'''
          new = '''            if chapter_accepted:\n                self._update_world_incremental(chapter_text, source_type="chapter")\n'''
          if old not in block:
              raise SystemExit('Write Chapter character-update block not found.')
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]

          # Keep the existing helper for other workflows; only remove the Change Chapter call.
          start = text.index('    def _finalize_changed_chapter(')
          end = text.index('\n    def _run_change_chapter', start)
          block = text[start:end]
          old = '''        self._extract_and_merge_characters(chapter.content)\n        self._update_world_incremental(chapter.content, source_type="chapter")\n'''
          new = '''        self._update_world_incremental(chapter.content, source_type="chapter")\n'''
          if old not in block:
              raise SystemExit('Change Chapter character-update block not found.')
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          workflow.write_text(text, encoding='utf-8')

          change = Path('engine/change_chapter.py')
          ctext = change.read_text(encoding='utf-8')
          old_doc = 'Characters/World are refreshed only once the chapter is accepted.'
          new_doc = 'World is refreshed only once the chapter is accepted.'
          if old_doc in ctext:
              ctext = ctext.replace(old_doc, new_doc, 1)
          change.write_text(ctext, encoding='utf-8')

          for path in ('engine/workflow.py', 'engine/change_chapter.py'):
              compile(Path(path).read_text(encoding='utf-8'), path, 'exec')

          final = workflow.read_text(encoding='utf-8')
          ws = final[final.index('    def _run_write_chapter('):final.index('\n    def _run_write_book', final.index('    def _run_write_chapter('))]
          if '_extract_and_merge_characters(' in ws:
              raise SystemExit('Write Chapter still updates Characters.')

          fs = final[final.index('    def _finalize_changed_chapter('):final.index('\n    def _run_change_chapter', final.index('    def _finalize_changed_chapter('))]
          if '_extract_and_merge_characters(' in fs:
              raise SystemExit('Change Chapter still updates Characters.')

          helper = Path('.github/workflows/_disable_writer_character_updates.yml')
          helper.unlink()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'engine/workflow.py', 'engine/change_chapter.py', str(helper)], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: stop chapter writers from updating characters'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:bugfixes'], check=True)
